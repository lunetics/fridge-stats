# fridge-stats package (English) — state + statistics layer for the Fridge Door Monitor.
# Deliberately source-agnostic: NO reference to any physical sensor lives here.
# All sensor wiring happens in the blueprint automation instance (fully configurable).
# German variant: package/fridge_stats.de.yaml (keeps the sensor.kuhlschrank_* ids).
# Repo: ~/Projekte/homeassistant/fridge-stats (deploy via deploy.sh; edits belong in the repo).

input_boolean:
  fridge_door_open:
    name: "Fridge door open (detected)"
    icon: mdi:fridge-alert

input_number:
  fridge_t0:
    name: "Fridge T0 (before opening)"
    min: -10
    max: 30
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    mode: box
  fridge_troom0:
    name: "Fridge room temp at opening"
    min: 0
    max: 45
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer
    mode: box
  fridge_peak:
    name: "Fridge peak temp during opening"
    # running maximum while the door is open; the close rule needs a confirmed
    # fall below THIS, not merely below the previous report
    min: -10
    max: 45
    step: 0.01
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
    mode: box
  fridge_tau:
    name: "Fridge tau (calibration constant)"
    # no initial: — value must survive restarts (recalibration!); seeded once at deploy
    min: 300
    max: 5400
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    mode: box
  fridge_last_open_duration:
    name: "Fridge last opening duration"
    min: 0
    max: 86400
    step: 1
    unit_of_measurement: "s"
    icon: mdi:timer-outline
    mode: box
  fridge_open_seconds_total:
    name: "Fridge open seconds total"
    min: 0
    max: 100000000
    step: 1
    unit_of_measurement: "s"
    icon: mdi:sigma
    mode: box

input_datetime:
  fridge_opened_at:
    name: "Fridge opened at"
    has_date: true
    has_time: true
    icon: mdi:clock-start

input_text:
  fridge_last_event_class:
    name: "Fridge last event class"
    icon: mdi:tag-outline

counter:
  fridge_openings_total:
    name: "Fridge openings total"
    icon: mdi:counter
    restore: true
  fridge_short_grabs_total:
    # sub-floor openings booked by the OPTIONAL humidity companion blueprint
    # (fridge_humidity_monitor); stays at 0 without it
    name: "Fridge short grabs total"
    icon: mdi:counter
    restore: true

# Mirror sensors: expose helper values as proper sensors so that recorder LTS,
# the statistics platform and utility_meter can consume them.
# (YAML templates by design here: this package is git-managed — UI Template
# Helpers would not be version-controlled.)
template:
  - sensor:
      - name: "Fridge door last opening duration"
        unique_id: fridge_door_last_opening_duration
        unit_of_measurement: "s"
        device_class: duration
        state_class: measurement
        icon: mdi:door-open
        # Event-gated: only available for ~1 h after an opening, so long-term
        # statistics average EVENT durations - a permanently held value would
        # pollute every event-free hour with a stale mean.
        availability: >-
          {{ has_value('input_number.fridge_last_open_duration')
             and states('input_number.fridge_last_open_duration') | float(0) > 0
             and has_value('input_datetime.fridge_opened_at')
             and (now().timestamp() - state_attr('input_datetime.fridge_opened_at', 'timestamp') | float(0)) < 3600 }}
        state: "{{ states('input_number.fridge_last_open_duration') | float(0) | round(0) }}"
      - name: "Fridge door openings total"
        unique_id: fridge_door_openings_total
        state_class: total_increasing
        icon: mdi:counter
        availability: "{{ has_value('counter.fridge_openings_total') }}"
        state: "{{ states('counter.fridge_openings_total') | int(0) }}"
      - name: "Fridge short grabs"
        unique_id: fridge_short_grabs
        state_class: total_increasing
        icon: mdi:water-percent
        availability: "{{ has_value('counter.fridge_short_grabs_total') }}"
        state: "{{ states('counter.fridge_short_grabs_total') | int(0) }}"
      - name: "Fridge door open time total"
        unique_id: fridge_door_open_time_total
        unit_of_measurement: "s"
        device_class: duration
        state_class: total_increasing
        icon: mdi:sigma
        availability: "{{ has_value('input_number.fridge_open_seconds_total') }}"
        state: "{{ states('input_number.fridge_open_seconds_total') | float(0) | round(0) }}"
      # Readable duration displays: string states ("42 s" / "26 min" / "9.9 h")
      # for dashboard rows - display-only, no unit/state_class.
      - name: "Fridge open time today readable"
        unique_id: fridge_open_time_today_readable
        icon: mdi:clock-outline
        availability: "{{ has_value('sensor.fridge_open_time_today') }}"
        state: >-
          {% set s = states('sensor.fridge_open_time_today') | float(0) %}
          {% if s < 60 %}{{ s | round(0) | int }} s
          {%- elif s < 3600 %}{{ (s / 60) | round(0) | int }} min
          {%- else %}{{ (s / 3600) | round(1) }} h{% endif %}
      - name: "Fridge open time month readable"
        unique_id: fridge_open_time_month_readable
        icon: mdi:clock-outline
        availability: "{{ has_value('sensor.fridge_open_time_month') }}"
        state: >-
          {% set s = states('sensor.fridge_open_time_month') | float(0) %}
          {% if s < 60 %}{{ s | round(0) | int }} s
          {%- elif s < 3600 %}{{ (s / 60) | round(0) | int }} min
          {%- else %}{{ (s / 3600) | round(1) }} h{% endif %}
      - name: "Fridge open time total readable"
        unique_id: fridge_open_time_total_readable
        icon: mdi:sigma
        availability: "{{ has_value('input_number.fridge_open_seconds_total') }}"
        state: >-
          {% set s = states('input_number.fridge_open_seconds_total') | float(0) %}
          {% if s < 60 %}{{ s | round(0) | int }} s
          {%- elif s < 3600 %}{{ (s / 60) | round(0) | int }} min
          {%- else %}{{ (s / 3600) | round(1) }} h{% endif %}
      - name: "Fridge last opening duration readable"
        unique_id: fridge_last_opening_duration_readable
        icon: mdi:door-open
        availability: "{{ has_value('input_number.fridge_last_open_duration') }}"
        state: >-
          {% set s = states('input_number.fridge_last_open_duration') | float(0) %}
          {% if s < 60 %}{{ s | round(0) | int }} s
          {%- elif s < 3600 %}{{ (s / 60) | round(0) | int }} min
          {%- else %}{{ (s / 3600) | round(1) }} h{% endif %}
      - name: "Fridge opening duration median 7d readable"
        unique_id: fridge_opening_duration_median_7d_readable
        icon: mdi:calculator-variant-outline
        availability: "{{ has_value('sensor.fridge_opening_duration_median_7d') }}"
        state: >-
          {% set s = states('sensor.fridge_opening_duration_median_7d') | float(0) %}
          {% if s < 60 %}{{ s | round(0) | int }} s
          {%- elif s < 3600 %}{{ (s / 60) | round(0) | int }} min
          {%- else %}{{ (s / 3600) | round(1) }} h{% endif %}
      - name: "Fridge opening duration max 7d readable"
        unique_id: fridge_opening_duration_max_7d_readable
        icon: mdi:calculator-variant
        availability: "{{ has_value('sensor.fridge_opening_duration_max_7d') }}"
        state: >-
          {% set s = states('sensor.fridge_opening_duration_max_7d') | float(0) %}
          {% if s < 60 %}{{ s | round(0) | int }} s
          {%- elif s < 3600 %}{{ (s / 60) | round(0) | int }} min
          {%- else %}{{ (s / 3600) | round(1) }} h{% endif %}
      - name: "Fridge door state"
        unique_id: fridge_door_state
        icon: >-
          {{ 'mdi:fridge-alert' if is_state('input_boolean.fridge_door_open', 'on')
             else 'mdi:fridge' }}
        state: >-
          {% if is_state('input_boolean.fridge_door_open', 'on') %}open
          {%- else %}closed{% endif %}
        attributes:
          last_class: "{{ states('input_text.fridge_last_event_class') }}"
          last_duration_s: "{{ states('input_number.fridge_last_open_duration') }}"
          opened_at: "{{ states('input_datetime.fridge_opened_at') }}"

sensor:
  - platform: statistics
    name: "Fridge opening duration median 7d"
    unique_id: fridge_opening_duration_median_7d
    entity_id: sensor.fridge_door_last_opening_duration
    state_characteristic: median
    sampling_size: 500
    max_age:
      days: 7
  - platform: statistics
    name: "Fridge opening duration max 7d"
    unique_id: fridge_opening_duration_max_7d
    entity_id: sensor.fridge_door_last_opening_duration
    state_characteristic: value_max
    sampling_size: 500
    max_age:
      days: 7

utility_meter:
  fridge_openings_daily:
    name: "Fridge openings today"
    source: sensor.fridge_door_openings_total
    cycle: daily
  fridge_openings_weekly:
    name: "Fridge openings week"
    source: sensor.fridge_door_openings_total
    cycle: weekly
  fridge_openings_monthly:
    name: "Fridge openings month"
    source: sensor.fridge_door_openings_total
    cycle: monthly
  fridge_open_time_daily:
    name: "Fridge open time today"
    source: sensor.fridge_door_open_time_total
    cycle: daily
  fridge_open_time_monthly:
    name: "Fridge open time month"
    source: sensor.fridge_door_open_time_total
    cycle: monthly
  fridge_short_grabs_daily:
    name: "Fridge short grabs today"
    source: sensor.fridge_short_grabs
    cycle: daily
